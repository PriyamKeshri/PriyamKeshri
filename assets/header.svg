  <rect x="736.5" y="40.5" width="419" height="219" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="760" cy="62" r="5.5" fill="#F87171"/><circle cx="779" cy="62" r="5.5" fill="#FBBF24"/><circle cx="798" cy="62" r="5.5" fill="#34D399"/>
  <text x="946" y="66" class="mono" font-size="12" fill="#64748B" text-anchor="middle">about_me.py</text>
  <line x1="737" y1="84" x2="1155" y2="84" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="770" y="112" class="mono" font-size="12" fill="#475569" text-anchor="end">1</text><text x="788.0" y="112" class="mono" font-size="13" xml:space="preserve"><tspan fill="#E2E8F0">priyam</tspan><tspan fill="#94A3B8"> = </tspan><tspan fill="#A5B4FC">Developer</tspan><tspan fill="#94A3B8">(</tspan></text>
  <text x="770" y="136" class="mono" font-size="12" fill="#475569" text-anchor="end">2</text><text x="819.3" y="136" class="mono" font-size="13" xml:space="preserve"><tspan fill="#7DD3FC">focus</tspan><tspan fill="#94A3B8">=[</tspan><tspan fill="#5EEAD4">"RAG"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#5EEAD4">"agents"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#5EEAD4">"evals"</tspan><tspan fill="#94A3B8">],</tspan></text>
  <text x="770" y="160" class="mono" font-size="12" fill="#475569" text-anchor="end">3</text><text x="819.3" y="160" class="mono" font-size="13" xml:space="preserve"><tspan fill="#7DD3FC">stack</tspan><tspan fill="#94A3B8">=[</tspan><tspan fill="#5EEAD4">"Python"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#5EEAD4">"FastAPI"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#5EEAD4">"Postgres"</tspan><tspan fill="#94A3B8">],</tspan></text>
  <text x="770" y="184" class="mono" font-size="12" fill="#475569" text-anchor="end">4</text><text x="819.3" y="184" class="mono" font-size="13" xml:space="preserve"><tspan fill="#7DD3FC">based_in</tspan><tspan fill="#94A3B8">=</tspan><tspan fill="#5EEAD4">"Bengaluru, India"</tspan><tspan fill="#94A3B8">,</tspan></text>
  <text x="770" y="208" class="mono" font-size="12" fill="#475569" text-anchor="end">5</text><text x="819.3" y="208" class="mono" font-size="13" xml:space="preserve"><tspan fill="#7DD3FC">open_to</tspan><tspan fill="#94A3B8">=</tspan><tspan fill="#5EEAD4">"AI/ML Engineer roles"</tspan><tspan fill="#94A3B8">,</tspan></text>
  <text x="770" y="232" class="mono" font-size="12" fill="#475569" text-anchor="end">6</text><text x="788.0" y="232" class="mono" font-size="13" xml:space="preserve"><tspan fill="#94A3B8">)</tspan></text>
  <rect class="cursor" x="798.8" y="220" width="8" height="15" rx="1" fill="#A5B4FC"/>
</svg>
