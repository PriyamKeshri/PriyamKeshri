  <circle cx="279.2" cy="230" r="3.5" fill="#34D399"/>
  <text x="290.2" y="235" font-size="14.5" fill="#E2E8F0" font-weight="500">LLM evals</text>
  <rect x="385.3" y="214" width="158.0" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="400.3" cy="230" r="3.5" fill="#FBBF24"/>
  <text x="411.3" y="235" font-size="14.5" fill="#E2E8F0" font-weight="500">Machine learning</text>
  <rect x="553.3" y="214" width="136.7" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="568.3" cy="230" r="3.5" fill="#F472B6"/>
  <text x="579.3" y="235" font-size="14.5" fill="#E2E8F0" font-weight="500">Backend APIs</text>

