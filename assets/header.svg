  <g clip-path="url(#clip)"><rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <ellipse cx="930" cy="30" rx="440" ry="300" fill="url(#glowA)"/>
  <ellipse cx="1170" cy="320" rx="300" ry="220" fill="url(#glowB)"/>
  <ellipse cx="60" cy="310" rx="400" ry="210" fill="url(#glowC)"/></g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

