  <text x="51.0" y="196.5" font-size="13" fill="#E2E8F0" font-weight="500">RAG</text>
  <rect x="99.9" y="178" width="93.2" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="112.9" cy="192" r="3.2" fill="#A78BFA"/>
  <text x="122.9" y="196.5" font-size="13" fill="#E2E8F0" font-weight="500">AI agents</text>
  <rect x="200.1" y="178" width="97.8" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="213.1" cy="192" r="3.2" fill="#34D399"/>
  <text x="223.1" y="196.5" font-size="13" fill="#E2E8F0" font-weight="500">LLM evals</text>
  <rect x="304.9" y="178" width="140.0" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="317.9" cy="192" r="3.2" fill="#FBBF24"/>
  <text x="327.9" y="196.5" font-size="13" fill="#E2E8F0" font-weight="500">Machine learning</text>
