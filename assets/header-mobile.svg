<svg xmlns="http://www.w3.org/2000/svg" width="480" height="236" viewBox="0 0 480 236" role="img" aria-labelledby="title">
  <title id="title">Priyam Keshri, GenAI Developer. I build RAG systems, AI agents and ML apps that stay useful beyond the demo.</title>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}</style>
  <defs>
    <clipPath id="clip"><rect width="480" height="236" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#1A1540"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#6366F1" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.07"/></pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="212" y1="0" x2="350" y2="0">
      <stop offset="0" stop-color="#A5B4FC"/><stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip)"><rect width="480" height="236" fill="url(#bg)"/>
  <rect width="480" height="236" fill="url(#dots)"/>
  <ellipse cx="400" cy="10" rx="260" ry="190" fill="url(#glowA)"/>
  <ellipse cx="480" cy="250" rx="200" ry="150" fill="url(#glowB)"/>
  <ellipse cx="20" cy="250" rx="240" ry="150" fill="url(#glowC)"/></g>
  <rect x="0.5" y="0.5" width="479" height="235" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g transform="translate(28 26)"><rect width="46" height="46" rx="12" fill="url(#brand)"/>
    <text x="23" y="30.5" font-size="19.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.4">PK</text></g>
  <text x="86" y="62" font-size="37" font-weight="800" fill="#F8FAFC" letter-spacing="-0.7">Priyam <tspan fill="url(#name)">Keshri</tspan></text>
  <text x="28" y="109" font-size="22" font-weight="600" fill="#E2E8F0">GenAI Developer</text>
  <text x="28" y="136" font-size="15" fill="#A7B4CC">I build RAG systems, AI agents and ML apps</text>
  <text x="28" y="157" font-size="15" fill="#A7B4CC">that stay useful beyond the demo.</text>
